services:
  - type: web
    name: personal-portfolio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3FORMS_ACCESS_KEY
        value: "YOUR_WEB3FORMS_ACCESS_KEY_HERE"
      - key: GITHUB_USERNAME
        value: "torvalds"
