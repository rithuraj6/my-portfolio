<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Cyber Gradient -->
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#9d4edd;#00ff88;#00f0ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9d4edd">
        <animate attributeName="stop-color" values="#9d4edd;#00f0ff;#9d4edd" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shining Sweep Gradient -->
    <linearGradient id="shine-sweep" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.95)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      <animate attributeName="x1" from="-150%" to="250%" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-50%" to="350%" dur="2.8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    /* Radar Beep Pulse Wave */
    .radar-ring {
      transform-origin: 50px 50px;
      animation: beepPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .radar-ring-2 {
      transform-origin: 50px 50px;
      animation: beepPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 1.2s;
    }
    @keyframes beepPulse {
      0% {
        r: 32px;
        opacity: 0.85;
        stroke-width: 2.5px;
      }
      100% {
        r: 48px;
        opacity: 0;
        stroke-width: 0.5px;
      }
    }

    /* R Blink / Beacon Lamp */
    .beacon-dot {
      animation: beaconBlink 1.2s ease-in-out infinite alternate;
    }
    @keyframes beaconBlink {
      0% {
        opacity: 0.25;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.3);
        filter: drop-shadow(0 0 6px #00f0ff);
      }
    }

    /* Bold R Outline Glow */
    .bold-r-path {
      fill: url(#r-grad);
      filter: url(#neon-glow);
    }
  </style>

  <!-- Deep Obsidian Base Disc -->
  <circle cx="50" cy="50" r="44" fill="#060814" stroke="#18233c" stroke-width="2" />

  <!-- Radar Auto-Beeping Rings -->
  <circle class="radar-ring" cx="50" cy="50" r="34" fill="none" stroke="#00f0ff" opacity="0.6" />
  <circle class="radar-ring-2" cx="50" cy="50" r="34" fill="none" stroke="#9d4edd" opacity="0.6" />

  <!-- Outer Orbit Track -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- Heavy Geometric Bold 'R' -->
  <!-- Clean glyph: Left spine, top lobe, diagonal kick -->
  <path class="bold-r-path" d="
    M 30,22 
    L 55,22 
    C 67,22 74,28 74,38 
    C 74,47 67,52 57,53 
    L 73,78 
    L 58,78 
    L 45,55 
    L 42,55 
    L 42,78 
    L 30,78 
    Z 
    M 42,33 
    L 42,45 
    L 54,45 
    C 59,45 62,43 62,39 
    C 62,35 59,33 54,33 
    Z" />

  <!-- Shining Sweep Overlay Layer -->
  <path fill="url(#shine-sweep)" d="
    M 30,22 
    L 55,22 
    C 67,22 74,28 74,38 
    C 74,47 67,52 57,53 
    L 73,78 
    L 58,78 
    L 45,55 
    L 42,55 
    L 42,78 
    L 30,78 
    Z" opacity="0.75" />

  <!-- Auto-Beeping Radar Center Beacon Dot -->
  <circle class="beacon-dot" cx="72" cy="24" r="3.5" fill="#00f0ff" />
</svg>
